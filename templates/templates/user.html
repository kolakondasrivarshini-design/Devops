<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>User Account</title>

    <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.1/dist/css/bootstrap.min.css">

</head>

<body>

<div class="container">

    <h1>User Profile</h1>

    <p>
        Logged in as:

        <strong>
            {{ session['name'] }}
        </strong>
    </p>

    <p>
        Email:

        <strong>
            {{ session['email'] }}
        </strong>
    </p>

    <a href="{{ url_for('logout') }}"
       class="btn btn-danger">

        Logout

    </a>

    <hr>

    <h2>
        Welcome to the user profile page!
    </h2>

</div>

</body>

</html>
