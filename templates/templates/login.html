<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>User Login Form</title>

</head>

<body>

<div class="container">

    <h2>User Login</h2>

    <form action="{{ url_for('login') }}"
          method="post">

        {% if message %}

            <div class="alert alert-warning">
                {{ message }}
            </div>

        {% endif %}

        <div class="form-group">

            <label for="email">
                Email:
            </label>

            <input type="email"
                   class="form-control"
                   id="email"
                   name="email"
                   placeholder="Enter email"
                   required>

        </div>

        <div class="form-group">

            <label for="password">
                Password:
            </label>

            <input type="password"
                   class="form-control"
                   id="password"
                   name="password"
                   placeholder="Enter password"
                   required>

        </div>

        <button type="submit"
                class="btn btn-primary">

            Login

        </button>

        <p class="bottom">

            Don't have an account?

            <a href="{{ url_for('register') }}">
                Register here
            </a>

        </p>

    </form>

</div>

</body>

</html>
